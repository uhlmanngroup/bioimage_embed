[project]
name = "bioimage_embed"
version = "0.0.0"
description = "Embedding tools for bioimage analysis"
authors = [
    { name = "Craig", email = "ctr26@ebi.ac.uk" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "setuptools<70",
    "umap-learn[plot]>=0.5.3",
    "jsonargparse[signatures]>=4.21.0",
    "pytorch-lightning>=1.9.0,<2.0.0",
    "torchinfo>=1.8.0",
    "matplotlib>=3.7.2",
    "pyro-ppl>=1.8.6",
    "scikit-image>=0.21.0",
    "iteround>=1.0.4",
    "ipykernel>=6.25.1",
    "nonechucks>=0.4.2",
    "pythae @ git+https://github.com/clementchadebec/benchmark_VAE.git@main",
    "pandas>=2.1.0",
    "bokeh>=3.2.2",
    "colorcet>=3.0.1",
    "holoviews>=1.17.1",
    "tensorboard>=2.14.0",
    "albumentations>=1.3.1",
    "timm>=0.9.6",
    "hydra-core>=1.3.2",
    "requests>=2.31.0",
    "shapely>=2.0.1",
    "pyefd>=1.6.0",
    "tikzplotlib>=0.10.1",
    "torchmetrics>=0.11.4",
    "lightning-bolts>=0.7.0",
    "Pillow>=9.5.0",
    "onnx>=1.15.0",
    "typer>=0.9.0",
    "ray[all]>=2.8.1",
    "pydantic>=2.6.4",
    "numpy>=1.23",
    "monai>=1.3.2",
    "transformers>=4.42.4",
    "torch>=2.3.1",
    "torchvision>=0.18.1",
    "wandb>=0.17.4",
    "jupytext>=1.16.4",
    "jupyter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0",
    "pre-commit>=3.7.1",
    "isort>=5.13.2",
    "jupytext>=1.16.2",
]

[project.scripts]
bioimage_embed = "bioimage_embed:app"
bie = "bioimage_embed.cli:app"
bie_train = "bioimage_embed.cli:train"
bie_infer = "bioimage_embed.cli:infer"
bie_finetune = "bioimage_embed.cli:finetune"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["bioimage_embed"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --ignore=env"
pythonpath = ["bioimage_embed"]
timeout = 180

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
line_length = 80
